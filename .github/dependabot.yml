version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      # Friday, so PRs are ready for the Saturday PR review.
      day: "friday"
      time: "06:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 3
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dependencies:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # TypeScript 7 is the native compiler, which doesn't yet ship the
      # programmatic API that @astrojs/language-server (astro check) relies on,
      # so `npm run type-check` fails on it. Remove once Astro supports TS 7.
      # https://github.com/withastro/astro/pull/17345
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "Europe/London"
    groups:
      actions:
        patterns:
          - "*"
